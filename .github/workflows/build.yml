name: Build IPA
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and Package IPA
        run: |
          # Look for .xcodeproj or .xcworkspace anywhere in the repo
          PROJ_PATH=$(find . \( -name "*.xcodeproj" -o -name "*.xcworkspace" \) | head -n 1)

          if [ -z "$PROJ_PATH" ]; then
            echo "::error::No .xcodeproj or .xcworkspace found in repository."
            echo "--- DIRECTORY STRUCTURE ---"
            ls -R
            exit 1
          fi

          echo "Found project at: $PROJ_PATH"

          # Determine if it's a project or workspace
          PROJ_DIR=$(dirname "$PROJ_PATH")
          FILE_NAME=$(basename "$PROJ_PATH")
          
          cd "$PROJ_DIR"

          if [[ "$FILE_NAME" == *.xcworkspace ]]; then
            SCHEME=$(basename "$FILE_NAME" .xcworkspace)
            xcodebuild archive \
              -workspace "$FILE_NAME" \
              -scheme "$SCHEME" \
              -archivePath build.xcarchive \
              -sdk iphoneos \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO
          else
            SCHEME=$(basename "$FILE_NAME" .xcodeproj)
            xcodebuild archive \
              -project "$FILE_NAME" \
              -scheme "$SCHEME" \
              -archivePath build.xcarchive \
              -sdk iphoneos \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO
          fi

          # Package IPA
          mkdir Payload
          cp -R build.xcarchive/Products/Applications/*.app Payload/
          zip -r App.ipa Payload

          # Move to workspace root
          mv App.ipa "$GITHUB_WORKSPACE/App.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: my-ipa-file
          path: App.ipa
