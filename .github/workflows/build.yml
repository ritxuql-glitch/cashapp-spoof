name: Build iOS IPA

on:
  workflow_dispatch: # Allows you to manually trigger the build from the GitHub website

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      # Step 1: Check out your repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Xcode environment
      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      # Step 3: Clean & build the Xcode Archive
      - name: Build Xcode Archive
        run: |
          xcodebuild archive \
            -project YourApp.xcodeproj \
            -scheme YourScheme \
            -archivePath $RUNNER_TEMP/YourApp.xcarchive \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      # Step 4: Convert the archive into a payload / IPA
      - name: Package IPA
        run: |
          mkdir -p $RUNNER_TEMP/Payload
          cp -R $RUNNER_TEMP/YourApp.xcarchive/Products/Applications/*.app $RUNNER_TEMP/Payload/
          cd $RUNNER_TEMP
          zip -r YourApp.ipa Payload

      # Step 5: Upload the compiled .ipa file to GitHub Actions Artifacts
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOS-IPA-Build
          path: ${{ runner.temp }}/YourApp.ipa
