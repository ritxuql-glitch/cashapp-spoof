name: Build IPA
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          xcodebuild archive -project *.xcodeproj -scheme $(basename *.xcodeproj .xcodeproj) -archivePath build.xcarchive -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          mkdir Payload
          cp -R build.xcarchive/Products/Applications/*.app Payload/
          zip -r App.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: my-ipa-file
          path: App.ipa
