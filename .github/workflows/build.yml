name: Build IPA
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip Project & Build IPA
        run: |
          # Find and unzip any zipped .xcodeproj file
          ZIPPED_PROJ=$(find . -name "*.xcodeproj.zip" | head -n 1)

          if [ -n "$ZIPPED_PROJ" ]; then
            echo "Unzipping project file at $ZIPPED_PROJ..."
            ZIP_DIR=$(dirname "$ZIPPED_PROJ")
            unzip -o "$ZIPPED_PROJ" -d "$ZIP_DIR"
          fi

          # Locate the extracted .xcodeproj file
          PROJ_PATH=$(find . -name "*.xcodeproj" | head -n 1)

          if [ -z "$PROJ_PATH" ]; then
            echo "::error::Could not find .xcodeproj file."
            exit 1
          fi

          PROJ_DIR=$(dirname "$PROJ_PATH")
          PROJ_NAME=$(basename "$PROJ_PATH")
          
          # Extract scheme name without file extension
          SCHEME=$(basename "$PROJ_NAME" .xcodeproj)

          echo "Found project: $PROJ_NAME"
          echo "Building scheme: $SCHEME"

          cd "$PROJ_DIR"

          # Build Archive
          xcodebuild archive \
            -project "$PROJ_NAME" \
            -scheme "$SCHEME" \
            -archivePath build.xcarchive \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

          # Create Payload and zip to IPA
          mkdir Payload
          cp -R build.xcarchive/Products/Applications/*.app Payload/
          zip -r App.ipa Payload

          # Move completed IPA back to root directory
          mv App.ipa "$GITHUB_WORKSPACE/App.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: my-ipa-file
          path: App.ipa
